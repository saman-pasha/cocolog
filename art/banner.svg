<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <!-- cocolog, the bridge between the three: Cicili writes it, Zigurat keeps
       it, The Coco makes it think; cocolog is how state crosses from each
       to the others. Hand-drawn SVG, no external assets. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e1a"/>
      <stop offset="0.7" stop-color="#121831"/>
      <stop offset="1" stop-color="#182040"/>
    </linearGradient>
    <radialGradient id="medal" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#1d2647"/>
      <stop offset="1" stop-color="#131a35"/>
    </radialGradient>
    <radialGradient id="shieldface" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#b2452f"/>
      <stop offset="1" stop-color="#7e2f22"/>
    </radialGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe8d4"/>
      <stop offset="1" stop-color="#d9cfb2"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#cfd6ef">
    <circle cx="70" cy="52" r="1.6" opacity="0.8"/><circle cx="150" cy="120" r="1.1" opacity="0.5"/>
    <circle cx="215" cy="35" r="1.3" opacity="0.6"/><circle cx="330" cy="60" r="1.0" opacity="0.4"/>
    <circle cx="415" cy="30" r="1.5" opacity="0.7"/><circle cx="470" cy="98" r="1.0" opacity="0.5"/>
    <circle cx="540" cy="44" r="1.2" opacity="0.6"/><circle cx="600" cy="20" r="1.6" opacity="0.8"/>
    <circle cx="705" cy="38" r="1.1" opacity="0.5"/><circle cx="760" cy="86" r="1.4" opacity="0.6"/>
    <circle cx="835" cy="26" r="1.0" opacity="0.5"/><circle cx="905" cy="66" r="1.5" opacity="0.7"/>
    <circle cx="975" cy="36" r="1.1" opacity="0.5"/><circle cx="1060" cy="56" r="1.4" opacity="0.7"/>
    <circle cx="1130" cy="104" r="1.0" opacity="0.4"/><circle cx="1195" cy="40" r="1.6" opacity="0.8"/>
    <circle cx="1245" cy="90" r="1.1" opacity="0.5"/><circle cx="35" cy="140" r="1.0" opacity="0.4"/>
    <circle cx="120" cy="90" r="1.2" opacity="0.55"/><circle cx="1160" cy="140" r="1.0" opacity="0.4"/>
  </g>

  <!-- the name, in the sky -->
  <text x="640" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="36"
        font-weight="bold" fill="#e8e2d0" text-anchor="middle" letter-spacing="12">COCOLOG</text>
  <text x="640" y="73" font-family="Georgia, 'Times New Roman', serif" font-size="15"
        font-style="italic" fill="#9aa2c4" text-anchor="middle">the bridge &#183; a Prolog whose running state is data</text>

  <!-- a machine, crossing: state is data, and data travels the deck -->
  <line x1="60" y1="192" x2="1220" y2="192" stroke="#67c9bc" stroke-width="2"
        stroke-dasharray="7 8" opacity="0.45"/>

  <!-- ================= the three, carried on the span ================= -->

  <!-- CICILI, the philosopher -->
  <g>
    <circle cx="280" cy="142" r="63" fill="#7d8fd4" opacity="0.09"/>
    <circle cx="280" cy="142" r="57" fill="url(#medal)" stroke="#7d8fd4" stroke-width="2.5"/>
    <g transform="translate(280,142) scale(0.56) translate(-1000,-170)">
      <g>
        <path d="M1070 118 C1086 140 1083 174 1057 196 C1048 174 1051 142 1070 118 Z" fill="#aab8ea"/>
        <path d="M1070 118 C1062 142 1058 168 1057 196 L1053 192 C1055 164 1060 138 1070 118 Z" fill="#8fa0dd"/>
        <line x1="1057" y1="196" x2="1042" y2="222" stroke="#aab8ea" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M1042 222 L1038 231 L1047 226 Z" fill="#dfe5f8"/>
      </g>
      <g transform="rotate(6 1000 172)">
        <rect x="954" y="130" width="92" height="84" fill="url(#parch)" rx="3"/>
        <rect x="948" y="122" width="104" height="14" rx="7" fill="#cfc3a0"/>
        <rect x="948" y="208" width="104" height="14" rx="7" fill="#c7bb97"/>
        <text x="1000" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="30"
              fill="#4a4059" text-anchor="middle" font-style="italic">(&#955;)</text>
        <g stroke="#8d8168" stroke-width="3" stroke-linecap="round">
          <line x1="968" y1="188" x2="1018" y2="188"/>
          <line x1="968" y1="198" x2="1002" y2="198"/>
          <line x1="968" y1="146" x2="1030" y2="146"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ZIGURAT, the warrior -->
  <g>
    <circle cx="640" cy="142" r="63" fill="#c9873b" opacity="0.09"/>
    <circle cx="640" cy="142" r="57" fill="url(#medal)" stroke="#c9873b" stroke-width="2.5"/>
    <g transform="translate(640,142) scale(0.56) translate(-280,-168)">
      <g stroke="#9a6a2c" stroke-width="6" stroke-linecap="round">
        <line x1="224" y1="120" x2="338" y2="222"/>
        <line x1="336" y1="120" x2="222" y2="222"/>
      </g>
      <path d="M215 105 L237 113 L222 130 Z" fill="#d8a252"/>
      <path d="M345 105 L323 113 L338 130 Z" fill="#d8a252"/>
      <circle cx="280" cy="170" r="50" fill="url(#shieldface)" stroke="#d8a252" stroke-width="5"/>
      <circle cx="280" cy="170" r="38" fill="none" stroke="#d8a252" stroke-width="1.5" opacity="0.6"/>
      <g fill="#eec784">
        <rect x="253" y="180" width="54" height="9" rx="1.5"/>
        <rect x="264" y="168" width="32" height="9" rx="1.5"/>
        <rect x="271" y="156" width="18" height="9" rx="1.5"/>
        <rect x="277" y="147" width="6" height="6" rx="1"/>
      </g>
    </g>
  </g>

  <!-- THE COCO, the engineer -->
  <g>
    <circle cx="1000" cy="142" r="63" fill="#3aa89b" opacity="0.10"/>
    <circle cx="1000" cy="142" r="57" fill="url(#medal)" stroke="#3aa89b" stroke-width="2.5"/>
    <g transform="translate(1000,142) scale(0.47) translate(-640,-162)">
      <g fill="#2f8d82">
        <g transform="translate(640,162)">
          <rect x="-10" y="-92" width="20" height="20" rx="4"/>
          <rect x="-10" y="72" width="20" height="20" rx="4"/>
          <rect x="-92" y="-10" width="20" height="20" rx="4"/>
          <rect x="72" y="-10" width="20" height="20" rx="4"/>
          <g transform="rotate(45)">
            <rect x="-10" y="-92" width="20" height="20" rx="4"/>
            <rect x="-10" y="72" width="20" height="20" rx="4"/>
            <rect x="-92" y="-10" width="20" height="20" rx="4"/>
            <rect x="72" y="-10" width="20" height="20" rx="4"/>
          </g>
        </g>
      </g>
      <circle cx="640" cy="162" r="74" fill="none" stroke="#3aa89b" stroke-width="14"/>
      <g stroke="#67c9bc" stroke-width="3">
        <line x1="640" y1="162" x2="640" y2="118"/>
        <line x1="640" y1="162" x2="678" y2="140"/>
        <line x1="640" y1="162" x2="678" y2="184"/>
        <line x1="640" y1="162" x2="640" y2="206"/>
        <line x1="640" y1="162" x2="602" y2="184"/>
        <line x1="640" y1="162" x2="602" y2="140"/>
      </g>
      <g fill="#8fdcd1">
        <circle cx="640" cy="118" r="8"/>
        <circle cx="678" cy="140" r="8"/>
        <circle cx="678" cy="184" r="8"/>
        <circle cx="640" cy="206" r="8"/>
        <circle cx="602" cy="184" r="8"/>
        <circle cx="602" cy="140" r="8"/>
      </g>
      <circle cx="640" cy="162" r="13" fill="#e0a84a" stroke="#f3cf8d" stroke-width="2"/>
    </g>
  </g>

  <circle cx="820" cy="192" r="7" fill="#e0a84a" opacity="0.25"/>
  <circle cx="820" cy="192" r="4" fill="#e0a84a"/>

  <!-- ================= the bridge ================= -->

  <!-- deck -->
  <rect x="0" y="198" width="1280" height="4" fill="#565f94"/>
  <rect x="0" y="202" width="1280" height="16" fill="#39406b"/>
  <rect x="0" y="218" width="1280" height="6" fill="#262d52"/>

  <!-- labels on the deck face -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#cfd6ef"
     text-anchor="middle" opacity="0.8">
    <text x="280" y="215" letter-spacing="4">CICILI</text>
    <text x="640" y="215" letter-spacing="4">ZIGURAT</text>
    <text x="1000" y="215" letter-spacing="4">THE COCO</text>
  </g>

  <!-- body and piers -->
  <rect x="0" y="224" width="1280" height="132" fill="#242c54"/>

  <!-- the arches, and through each one the family's horizon -->
  <g>
    <path d="M121 356 V308 C121 250 439 250 439 308 V356 Z" fill="#10162e"/>
    <path d="M485 356 V308 C485 250 795 250 795 308 V356 Z" fill="#10162e"/>
    <path d="M841 356 V308 C841 250 1159 250 1159 308 V356 Z" fill="#10162e"/>
    <!-- distant ziggurats, seen through the spans -->
    <g fill="#1b234a">
      <path d="M150 356 V336 H200 V322 H240 V336 H290 V356 Z"/>
      <path d="M310 356 V340 H360 V328 H410 V340 H430 V356 Z"/>
      <path d="M520 356 V334 H570 V318 H620 V334 H670 V356 Z"/>
      <path d="M690 356 V342 H740 V330 H780 V342 H790 V356 Z"/>
      <path d="M870 356 V336 H920 V322 H960 V336 H1010 V356 Z"/>
      <path d="M1030 356 V340 H1080 V326 H1130 V340 H1150 V356 Z"/>
    </g>
    <!-- the river of state, flowing beneath -->
    <g stroke-width="3" stroke-linecap="round" opacity="0.4">
      <g stroke="#aab8ea">
        <line x1="160" y1="346" x2="205" y2="346"/><line x1="250" y1="350" x2="300" y2="350"/>
        <line x1="350" y1="345" x2="395" y2="345"/>
      </g>
      <g stroke="#d8a252">
        <line x1="530" y1="347" x2="585" y2="347"/><line x1="630" y1="351" x2="668" y2="351"/>
        <line x1="700" y1="345" x2="760" y2="345"/>
      </g>
      <g stroke="#67c9bc">
        <line x1="880" y1="346" x2="930" y2="346"/><line x1="975" y1="350" x2="1025" y2="350"/>
        <line x1="1070" y1="345" x2="1120" y2="345"/>
      </g>
    </g>
  </g>

  <!-- the ground -->
  <rect x="0" y="356" width="1280" height="44" fill="#0d1122"/>

  <!-- the one line -->
  <text x="640" y="384" font-family="Georgia, 'Times New Roman', serif" font-size="15"
        font-style="italic" fill="#7d86ad" text-anchor="middle" letter-spacing="1">
    the philosopher writes it &#183; the warrior keeps it &#183; the engineer makes it think &#183; the bridge carries it between them
  </text>
</svg>
