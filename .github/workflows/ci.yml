# CI: cocolog built from source, with Cicili and ZiguratIP beside it, and the
# whole suite run against a live ZiguratIP server -- on Ubuntu 24.04 and on macOS.
#
# File:   .github/workflows/ci.yml
# Starts: a push to master, a pull request into master, or by hand (Actions ->
#         CI -> Run workflow, which can name Cicili's and ZiguratIP's refs, and
#         build the Intel Mac's sbcl from source). A push or pull request that
#         changes nothing but the documents at the top of the tree, or only the
#         Docker files, starts nothing.
#
# THREE JOBS, each the same steps:
#
#   linux        ubuntu-24.04 (x86-64, 4 CPUs, 16 GB)    install/install-linux.sh
#   macos        macos-15 (Apple silicon, 3 CPUs, 7 GB)   install/install-macos.sh
#   macos-intel  macos-26-intel (x86-64, 4 CPUs, 14 GB)   install/install-macos.sh
#
# The Intel Mac is the owner's arrangement, macOS 26 on x86-64. Homebrew has
# built no Intel bottles since September 2026 (Tier 3 there), and SBCL
# publishes no x86-64 Darwin binary, so where no bottle pours, sbcl builds from
# source through ECL -- which is what the install step's two hours allow for.
# HOMEBREW_NO_AUTO_UPDATE keeps the formula data the runner image was built
# with, whose versions may still have Intel bottles. A run by hand with
# sbcl_from_source takes today's formula data and builds sbcl that way before
# the install, so the path an up-to-date Homebrew takes on Intel is proved on
# demand, through the whole install and suite.
#
# THE INSTALL IS THE INSTALLER, as the Dockerfile runs it, not a copy of its
# steps: packages, Quicklisp (kept in the Actions cache between runs), ZiguratIP
# built and its artifacts checked, make, make schema, make modules, and a query
# the binary must answer. The exports it prints for a shell profile are what the
# steps after it get. Then a ZiguratIP server is raised on 2160, the lint case
# runs first (CLAUDE.md, "The suite"), and then the suite, test/run.pl, every
# case -- the line `make test' runs, without the rebuild of the binary its `all'
# would make.
#
# A GREEN RUN HAS NO SKIP IT DID NOT EXPECT. The database cases SKIP with no
# server, files and trace without swipl, a module's case without its module --
# and the runner prints `red: 0' over all of it. tools/ci/verdict.sh reads every
# case's line: a red case, a case with no line, or a SKIP not in the job's
# allowed_skips makes the run red. Allowed on all three: the cases whose library
# no plain install builds (libtorch, TensorFlow's C API, raylib and a screen,
# NumPy, OpenCV). Allowed on the Macs besides: files and trace, which compare
# with the reference swipl 9.0.4 -- Ubuntu 24.04's swi-prolog-nox is it, and no
# Mac package is, so the Macs have no swipl at all and the comparison is Linux's.
#
# Each case that is red, or skipped where it should not have been, is then run
# again alone, because the runner keeps only five FAIL lines of a case and none
# of a SKIP's reason. The install's logs, the lint case's, the suite's, the
# server's and the reruns' are the run's artifact `ci-logs-OS-N' for 14 days.
name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['*.md', 'Dockerfile', '.dockerignore', '.github/workflows/docker-image.yml']
  pull_request:
    branches: [master]
    paths-ignore: ['*.md', 'Dockerfile', '.dockerignore', '.github/workflows/docker-image.yml']
  workflow_dispatch:
    inputs:
      cicili_ref:
        description: "Cicili branch, tag or commit to build with"
        type: string
        default: "master"
      ziguratip_ref:
        description: "ZiguratIP branch, tag or commit to build against"
        type: string
        default: "master"
      sbcl_from_source:
        description: "Intel Mac: build sbcl from source through ECL, from today's formula data, before the install"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    # per job: a new push to a pull request stops its last run, master's runs
    # each finish, one operating system never waits for the other, and a run by
    # hand never waits behind a push's
    concurrency:
      group: ci-${{ matrix.os }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            name: Ubuntu 24.04, the suite with a server
            runner: ubuntu-24.04
            install: install/install-linux.sh
            allowed_skips: tensors torch-graph torch-grad torch-replay tensorflow ray numpy opencv
          - os: macos
            name: macOS 15 (Apple silicon), the suite with a server
            runner: macos-15
            install: install/install-macos.sh
            allowed_skips: tensors torch-graph torch-grad torch-replay tensorflow ray numpy opencv files trace
          - os: macos-intel
            name: macOS 26 (Intel), the suite with a server
            runner: macos-26-intel
            install: install/install-macos.sh
            allowed_skips: tensors torch-graph torch-grad torch-replay tensorflow ray numpy opencv files trace
    env:
      # Homebrew as the image has it: no update of every tap before an install
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    defaults:
      run:
        shell: bash
        working-directory: cocolog
    steps:
      # side by side, as install/common.sh looks for them: ../cicili, ../ZiguratIP
      - name: Check out cocolog
        uses: actions/checkout@v7
        with:
          path: cocolog
          persist-credentials: false

      - name: Check out Cicili
        uses: actions/checkout@v7
        with:
          repository: saman-pasha/cicili
          ref: ${{ inputs.cicili_ref || 'master' }}
          path: cicili
          persist-credentials: false

      - name: Check out ZiguratIP
        uses: actions/checkout@v7
        with:
          repository: saman-pasha/ZiguratIP
          ref: ${{ inputs.ziguratip_ref || 'master' }}
          path: ZiguratIP
          persist-credentials: false

      # ZIGURATIP_HOME must be the same tree as $ZIGURATIP/home, by its real
      # path (install/common.sh refuses two), and CL_SOURCE_REGISTRY names the
      # Cicili checkout as CLAUDE.md's builds do
      - name: Where everything is
        run: |
          ws=$(cd .. && pwd -P)
          mkdir -p "$RUNNER_TEMP/logs"
          {
            echo "CICILI=$ws/cicili"
            echo "ZIGURATIP=$ws/ZiguratIP"
            echo "ZIGURATIP_HOME=$ws/ZiguratIP/home"
            echo "CL_SOURCE_REGISTRY=$ws/cicili/:"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "LOG=$RUNNER_TEMP/logs/install"
          } >> "$GITHUB_ENV"
          version=$(grep -o 'return "[0-9.]*"' cocolog.cicili | head -1 | grep -o '[0-9.][0-9.]*')
          {
            echo "### cocolog $version: ${{ matrix.name }}"
            echo
            echo "| checkout | commit |"
            echo "|---|---|"
            echo "| cocolog | \`$(git rev-parse HEAD)\` |"
            echo "| cicili | \`$(git -C "$ws/cicili" rev-parse HEAD)\` |"
            echo "| ZiguratIP | \`$(git -C "$ws/ZiguratIP" rev-parse HEAD)\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # what the cases want beyond the install: Ubuntu's own clang (18, as in the
      # Dockerfile, so install-linux.sh never goes to apt.llvm.org), swipl 9.0.4
      # for files and trace, lsof for the cases that wait for a port
      - name: The compiler, swipl and lsof (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y clang swi-prolog-nox lsof > /dev/null
          clang --version | head -1
          swipl --version

      # what the cases want beyond the install on a Mac: `timeout', which macOS
      # does not have and several cases run a child under. Coreutils' gtimeout,
      # under that one name only: BSD date, wc and sed stay what a Mac has, as
      # CLAUDE.md's macOS notes expect
      - name: timeout (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install coreutils > /dev/null
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(brew --prefix)/bin/gtimeout" "$HOME/.local/bin/timeout"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/timeout" --version | head -1
          clang --version | head -1

      - name: Quicklisp, from the cache
        id: quicklisp
        uses: actions/cache/restore@v6
        with:
          path: ~/quicklisp
          key: quicklisp-${{ runner.os }}-${{ hashFiles('cocolog/install/common.sh') }}
          restore-keys: quicklisp-${{ runner.os }}-

      # by hand only (Run workflow, sbcl_from_source): the sbcl an Intel Mac gets
      # where no bottle pours. sbcl's formula builds it from source with ECL as
      # the host compiler (SBCL publishes no x86-64 Darwin binary to start from),
      # and ECL pours. Today's formula data, not the image's, as a Mac whose
      # Homebrew is up to date has it, and of the rest only sbcl's own outdated
      # dependencies upgrade: no outdated formula named, no dependents checked
      # (gcc would build for hours). `brew update' still does to the image what
      # it does on its own: on the image of 2026-08-24 it moved azure-cli to a
      # cask and built openssl@4 from source for it, 11 of the step's 50 minutes
      # (run 40868931709). The install step then finds sbcl installed, and the
      # build, the lint case and the suite run on the sbcl built here
      - name: sbcl from source, through ECL (Intel, by hand)
        if: inputs.sbcl_from_source && matrix.os == 'macos-intel'
        timeout-minutes: 150
        env:
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew update --quiet
          brew --version | head -1
          if command -v jq > /dev/null 2>&1; then
            brew info --json=v2 sbcl ecl | jq -r '.formulae[] | "\(.name) \(.versions.stable): bottles \((.bottle.stable.files // {}) | keys | join(" ")); build dependencies: \(.build_dependencies | join(" "))"'
          else
            brew info sbcl ecl
          fi
          start=$(date +%s)
          rc=0
          brew install --build-from-source sbcl 2>&1 | tee "$LOGS/sbcl-source.out" || rc=$?
          mins=$(( ($(date +%s) - start + 59) / 60 ))
          # Homebrew keeps each build command's output apart: the tail of each
          mkdir -p "$LOGS/sbcl-build"
          for f in "$HOME/Library/Logs/Homebrew/sbcl"/*; do
            if [ -f "$f" ]; then tail -c 200000 "$f" > "$LOGS/sbcl-build/${f##*/}"; fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error title=sbcl::brew install --build-from-source sbcl failed after $mins minutes (exit status $rc)"
            exit "$rc"
          fi
          sbcl --version
          brew list --versions sbcl ecl
          echo "sbcl $(sbcl --version | cut -d' ' -f2), built from source through $(brew list --versions ecl) in $mins minutes." >> "$GITHUB_STEP_SUMMARY"

      - name: Install (${{ matrix.install }})
        id: install
        timeout-minutes: 120
        run: sh ${{ matrix.install }} 2>&1 | tee "$LOGS/install.out"

      # kept as soon as the install has it, so a red suite does not lose it
      - name: Quicklisp, into the cache
        if: steps.quicklisp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/quicklisp
          key: ${{ steps.quicklisp.outputs.cache-primary-key }}

      # the exports the installer printed for a shell profile -- the library
      # path, and on a Mac Homebrew's CPATH and LIBRARY_PATH -- for every step after
      - name: The installer's exports
        run: |
          grep -E '^   export [A-Za-z_][A-Za-z0-9_]*=' "$LOGS/install.out" | sed 's/^   export //' > "$LOGS/exports.txt"
          while IFS= read -r kv; do
            name=${kv%%=*}
            eval "value=\"${kv#*=}\""
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "$name=$value"
          done < "$LOGS/exports.txt"

      # every build here is clang (CLAUDE.md): on Linux the interpreter's own
      # object names clang, and no GCC line -- the one a linked binary carries is
      # the system's crtbeginS.o; a Mac has no other compiler than Apple's clang
      - name: What was built
        run: |
          ./cocolog --version
          if [ "$RUNNER_OS" = Linux ]; then
            comment=$(readelf -p .comment .libs/cocolog.o)
            printf '%s\n' "$comment"
            if ! printf '%s\n' "$comment" | grep -q 'clang version' || printf '%s\n' "$comment" | grep -q 'GCC:'; then
              echo "::error title=build::the interpreter was not compiled by clang"
              exit 1
            fi
          else
            otool -L ./cocolog
          fi
          modules=
          for so in library/*.so; do so=${so#library/}; modules="$modules ${so%.so}"; done
          echo "modules:$modules"
          if command -v swipl > /dev/null 2>&1; then against=$(swipl --version | cut -d' ' -f1-3); else against="no swipl"; fi
          {
            echo "Built by $(clang --version | head -1), SBCL $(sbcl --version | cut -d' ' -f2); $against."
            echo
            echo "Modules:$modules"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # the server finds its libraries through the installer's library path on
      # Linux and through its own rpath (@executable_path/../lib) on a Mac,
      # where nothing protected by SIP passes DYLD_LIBRARY_PATH on
      - name: Raise the ZiguratIP server on 2160
        id: server
        run: |
          cd "$ZIGURATIP"
          if command -v setsid > /dev/null 2>&1; then
            setsid "$ZIGURATIP_HOME/bin/ziguratip" > "$LOGS/ziguratip.log" 2>&1 < /dev/null &
          else
            "$ZIGURATIP_HOME/bin/ziguratip" > "$LOGS/ziguratip.log" 2>&1 < /dev/null &
          fi
          cd - > /dev/null
          for _ in $(seq 60); do
            lsof -iTCP:2160 -sTCP:LISTEN > /dev/null 2>&1 && break
            sleep 1
          done
          if ! lsof -iTCP:2160 -sTCP:LISTEN > /dev/null 2>&1; then
            echo "::error title=server::ZiguratIP is not listening on 2160 after a minute"
            tail -40 "$LOGS/ziguratip.log"
            exit 1
          fi
          echo "ziguratip: pid $(pgrep -x ziguratip)"
          ./cocolog --kb main --host 127.0.0.1 --tcp 2160 --timeout 10 list

      # the case by itself, in the environment test/run.pl gives every case, so
      # its whole output is in the log and not only its last line
      - name: The lint case, first
        timeout-minutes: 20
        run: |
          rc=0
          COCOLOG_LIBRARY="$PWD/library" PATH="$PWD/tools/cc:$PATH" \
            ./cocolog -s test/lint.pl 2>&1 | tee "$LOGS/lint.log" || rc=$?
          if grep -q '^SKIP' "$LOGS/lint.log"; then
            echo "::error title=lint::the lint case skipped: $(grep -m1 '^SKIP' "$LOGS/lint.log")"
            exit 1
          fi
          [ "$rc" -eq 0 ] || echo "::error title=lint::the lint case is red (exit status $rc)"
          exit "$rc"

      # a red lint case does not stop the suite: the whole picture in one run
      - name: The suite (test/run.pl)
        id: suite
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        timeout-minutes: 150
        run: ./cocolog -s test/run.pl 2>&1 | tee "$LOGS/suite.log"

      - name: The verdict (tools/ci/verdict.sh)
        id: verdict
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: |
          ./cocolog run test/run.pl \
            "cicili_names(A), pl_names(B), append(A, B, L), forall(member(X, L), (write(X), nl))" > "$LOGS/cases.txt"
          rc=0
          sh tools/ci/verdict.sh "$LOGS/suite.log" "$LOGS/cases.txt" "${{ matrix.allowed_skips }}" \
            "$GITHUB_STEP_SUMMARY" "$LOGS/rerun.txt" || rc=$?
          if pgrep -x ziguratip > /dev/null; then
            echo "The ZiguratIP server was still up after the suite."
          else
            echo "::error title=server::the ZiguratIP server is gone after the suite (its log is in the artifact)"
            echo "**The ZiguratIP server is gone after the suite.**" >> "$GITHUB_STEP_SUMMARY"
            rc=1
          fi
          exit "$rc"

      # diagnosis only: the verdict above is the run's
      - name: Each red case again, alone, with its whole output
        if: ${{ !cancelled() && steps.verdict.outcome == 'failure' }}
        timeout-minutes: 90
        run: |
          [ -s "$LOGS/rerun.txt" ] || exit 0
          export COCOLOG_LIBRARY="$PWD/library" PATH="$PWD/tools/cc:$PATH"
          printf '### Run again alone\n\n' >> "$GITHUB_STEP_SUMMARY"
          head -6 "$LOGS/rerun.txt" | while read -r c; do
            if [ ! -f "test/$c.pl" ]; then
              echo "- **$c**: a test binary; its FAIL lines are in the table above" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            out="$LOGS/alone-$c.log"
            rc=0
            timeout 1800 ./cocolog -s "test/$c.pl" > "$out" 2>&1 < /dev/null || rc=$?
            echo "::group::$c alone: exit status $rc"
            grep -E '^(FAIL|SKIP|ERROR)' "$out" | head -60 || true
            echo "-- its last lines:"
            tail -40 "$out"
            echo "::endgroup::"
            why=$(grep -m1 '^SKIP' "$out" || true)
            if [ -n "$why" ]; then v="$why"
            elif [ "$rc" -eq 0 ]; then v="GREEN alone"
            else v="exit status $rc, $(grep -c '^FAIL' "$out" || true) FAIL lines"
            fi
            echo "- **$c**: $v" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Gather the logs
        if: ${{ always() }}
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          if [ -n "${ZIGURATIP_HOME:-}" ] && [ -d "$ZIGURATIP_HOME/log" ]; then
            cp -R "$ZIGURATIP_HOME/log" "$RUNNER_TEMP/logs/ziguratip-home-log"
          fi
          df -h / | tail -1
          ls -l "$RUNNER_TEMP/logs"

      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/logs
          retention-days: 14
          if-no-files-found: warn
